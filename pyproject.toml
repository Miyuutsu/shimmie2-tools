[project]
name = "shimmie2-tools"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
    "av>=10.0.0",
    "huggingface-hub>=0.23.0",
    "numpy>=1.26.4",
    "open-clip-torch>=2.26.0",
    "orjson>=3.10.0",
    "pandas>=2.2.0",
    "pillow>=9.0.0",
    "psycopg2-binary>=2.9.5",
    "pydantic>=2.7.1",
    "pyvips>=2.2",
    "simple_parsing",
    "timm>=1.0.7",
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "transformers",
    "tqdm>=4.64.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes (unused imports, undefined names)
    "I",    # isort (automatic import sorting)
    "UP",   # pyupgrade (modernizes Python 3.10+ type hints & syntax)
    "B",    # flake8-bugbear (catches real bugs like mutable defaults, bare excepts)
    "C4",   # flake8-comprehensions (cleaner list/dict/set comprehensions)
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "PLE",  # Pylint errors
    "PLW",  # Pylint warnings
]
ignore = [
    "E501", # Let ruff format handle line length instead of failing lint on long URLs/strings
]
